openapi: 3.0.3
info:
  title: STIP API
  version: '1.0'
  license:
    name: GNU AGPLv3
    url: 'https://www.gnu.org/licenses/agpl.txt'
servers:
  - url: 'http://localhost:{port}/api/v1'
    variables:
      port:
        default: '8080'
paths:
  '/datenschutzbrief/download':
    parameters:
      - name: token
        schema:
          type: string
        in: query
        required: true
    get:
      tags:
        - Datenschutzbrief
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Datenschutzbrief File returned
      operationId: getDatenschutzbrief
      summary: get Datenschutzbrief
      x-quarkus-response-type: org.jboss.resteasy.reactive.RestMulti<io.vertx.mutiny.core.buffer.Buffer>
  '/datenschutzbrief/{gesuchId}/token':
    parameters:
      - name: gesuchId
        schema:
          $ref: './components/common.yaml#/UUID'
        in: path
        required: true
    get:
      parameters:
        - name: datenschutzbriefId
          schema:
            $ref: './components/common.yaml#/UUID'
          in: query
          required: true
      tags:
        - Datenschutzbrief
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/FileDownloadToken'
          description: Token returned
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/ServerError'
          description: Datenschutzbrief File Download Token returned
      operationId: getDatenschutzbriefDownloadToken
      summary: get Token to downlaod Verfuegung
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatenschutzbriefCreate'
      tags:
        - Datenschutzbrief
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/FileDownloadToken'
          description: Token returned
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/ServerError'
          description: Datenschutzbrief File Download Token returned
      operationId: createAndGetDatenschutzbriefDownloadToken
      summary: get Token to downlaod Verfuegung
  '/datenschutzbrief/{gesuchId}/all':
    parameters:
      - name: gesuchId
        schema:
          $ref: './components/common.yaml#/UUID'
        in: path
        required: true
    get:
      tags:
        - Datenschutzbrief
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatenschutzbriefOverview'
          description: The list of related DatenschutzbriefOverview
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/ServerError'
          description: Get all Datenschutzbriefs for given Gesuch
      operationId: getAllDatenschutzbriefs
      summary: Get all Datenschutzbriefs for given Gesuch
components:
  securitySchemes:
    $ref: './components/security.yaml#/securitySchemes'
  schemas:
    DatenschutzbriefCreate:
      required:
        - elternId
      type: object
      properties:
        elternId:
          $ref: './components/common.yaml#/UUID'
    DatenschutzbriefTyp:
      enum:
        - MANUELL
        - MASSENDRUCK
      type: string
    DatenschutzbriefOverview:
      required:
        - id
        - userErstellt
        - sozialversicherungsnummer
        - nachname
        - vorname
        - elternTyp
      type: object
      properties:
        id:
          $ref: './components/common.yaml#/UUID'
        timestampErstellt:
          $ref: './components/common.yaml#/LocalDate'
        userErstellt:
          type: string
        sozialversicherungsnummer:
          type: string
        nachname:
          type: string
        vorname:
          type: string
        elternTyp:
          $ref: './components/common.yaml#/ElternTyp'
        dokument:
          $ref: './components/common.yaml#/Dokument'
        massendruckJobId:
          $ref: './components/common.yaml#/UUID'

security:
  $ref: './components/security.yaml#/security'
