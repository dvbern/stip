old:
  sap:
    system-id: '${STIP_SAP_SYSID}'
    auth-header-value: '${STIP_SAP_AUTH_HEADER_VALUE}'
    connectionTimeout: 6000
    receiveTimeout: 1000

kstip:
  oidc:
    url: ${STIP_OIDC_AUTH_SERVER}
  welcome-mail:
    client-id-sachbearbeiter: '${STIP_WELCOME_MAIL_CLIENT_ID_SACHBEARBEITER:stip-sachbearbeitung-app}'
    client-id-sozialdienst: '${STIP_WELCOME_MAIL_CLIENT_ID_SOZIALDIENST:stip-sozialdienst-app}'
  s3:
    bucket-name: '${bucket.name}'

  scheduler:
    plz-data:
      cron: '0 15 10 10W * ?' # Fires at 10:15 on the closest weekday to the 10th of each month
    gesuch-periode:
      cron: '0 0 0 1/1 * ? *' # Fires daily at 00:00
    unterschriftenblatt:
      cron: '0 0 9 1/1 * ? *' # Fires daily at 09:00
    fehlende-dokumente:
      cron: '0 0 10 1/1 * ? *' # Fires daily at 10:00
    sap-business-partner:
      cron: '0 0/2 * * * ? *' # Every 2 minutes, starting at XX:00
    sap-pending-auszahlung:
      cron: '0 1/2 * * * ? *' # Every 2 minutes, starting at XX:01
    sap-remainder-auszahlung:
      cron: '0 2/2 * * * ? *' # Every 2 minutes, starting at XX:02
    sap-retry-failed-auszahlungs-buchhaltung:
      cron: '0 3/2 * * * ? *' # Every 2 minutes, starting at XX:03

  global-adapter:
    pdf:
      typst:
        binary: "/usr/local/bin/typst"
        max-output-bytes: 10000000
        compile-timeout: 10
        shutdown-wait-timeout: 10
        shutdown-force-timeout: 5
        root-path: "/deployments/typst"
        fonts-path: "/deployments/fonts"

  # Tenants
  #
  # All tenant-specific configuration lives here. Each tenant has the same
  # structure.
  #
  # Environment overrides:
  #   KSTIP_TENANT_BERN_SEEDING_SOZIALDIENSTE
  #   KSTIP_TENANT_DV_SEEDING_SOZIALDIENSTE
  #   ...
  tenant:
    bern:
      subdomains:
        - '^dev-.*'
        - '^feature-kstip.*'
      port:
        steuerdaten:
          enabled: true
          adapter-type: nesko
        berechnung:
          adapter-type: bern
          major-version: 1
          minor-version: 0
        pdf:
          adapter-type: typst
        payment-processing:
          adapter-type: sap-bern
      adapter:
        pdf:
          typst:
            root-template-path: tenants/bern
            template-path:
              berechnungsblatt-uebersicht: /tenants/bern/templates/berechnung/uebersicht.typ
              berechnungsblatt-pia: /tenants/bern/templates/berechnung/pia.typ
              berechnungsblatt-familie: /tenants/bern/templates/berechnung/familie.typ
        steuerdaten:
          nesko:
            url: 'https://nesko-int.sv.fin.be.ch/evasnp/AuskunftService/services/StipendienAuskunftService?wsdl'
            username: '${NESKO_TECHNICAL_USER_NAME}'
            password: '${NESKO_TECHNICAL_USER_PASSWORD}'
      keycloak-admin-client-config:
        server-url: ${kstip.oidc.url}
        client-id: stip-api
        client-secret: ${STIP_BERN_KEYCLOAK_ADMIN_CLIENT_CLIENT_SECRET}
    dv:
      subdomains:
        - '^dv-.*'
      port:
        steuerdaten:
          enabled: true
          adapter-type: dummy
        berechnung:
          adapter-type: bern
          major-version: 1
          minor-version: 0
        pdf:
          adapter-type: typst
        gemeinde-lookup:
          adapter-type: dummy
        plz-fetch:
          adapter-type: dummy
        payment-processing:
          adapter-type: dummy
      adapter:
        pdf:
          typst:
            root-template-path: tenants/bern
            template-path:
              berechnungsblatt-uebersicht: /tenants/bern/templates/berechnung/uebersicht.typ
              berechnungsblatt-pia: /tenants/bern/templates/berechnung/pia.typ
              berechnungsblatt-familie: /tenants/bern/templates/berechnung/familie.typ
      keycloak-admin-client-config:
        server-url: ${kstip.oidc.url}
        client-id: stip-api
        client-secret: ${STIP_DV_KEYCLOAK_ADMIN_CLIENT_CLIENT_SECRET}
  seeding:
    seed-on-profile:
      - 'prod'
      - 'dev'

quarkus:
  scheduler:
    start-mode: forced
  #  live-reload:
  #    instrumentation: true
  hibernate-validator:
    method-validation:
      # Seems to be an issue with hibernate-validator < 9.0
      # Currently we are using 8.0.2
      # see:
      # * https://github.com/quarkusio/quarkus/issues/35144
      # * ^--- was closed by https://github.com/quarkusio/quarkus/pull/42292
      allow-overriding-parameter-constraints: true
  log:
    sentry:
      enabled: true
      dsn: '${STIP_SENTRY_DSN}'
      traces-sample-rate: 1.0
      environment: '${KSTIP_ENVIRONMENT}'
      in-app-packages: 'ch.dvbern.stip.*'
    console:
      format: '%z{Europe/Zurich} %d{yyyy-MM-dd HH:mm:ss,SSS z}  %p [%C] (%t) %m %n'
  antivirus:
    clamav:
      enabled: true
      health:
        enabled: true
  execution-model-annotations:
    # TODO: use FAIL as soon as @Blocking is detected on subclasses
    # see: https://github.com/quarkusio/quarkus/issues/38275
    detection-mode: WARN
  liquibase:
    migrate-at-start: true
    # Only tenant independent changelogs against the "public"
    change-log: 'db/migration/changelog-public.xml'
    validate-on-migrate: true
  oidc:
    bern:
      auth-server-url: '${kstip.oidc.url}/realms/bern'
      client-id: '${kstip.oidc.client-id}'
      application-type: service
    dv:
      auth-server-url: '${kstip.oidc.url}/realms/dv'
      client-id: '${kstip.oidc.client-id}'
      application-type: service
  s3:
    aws:
      credentials:
        type: static
        static-provider:
          access-key-id: '${STIP_S3_ACCESS_KEY}'
          secret-access-key: '${STIP_S3_ACCESS_SECRET}'
      region: '${STIP_S3_REGION}'
    path-style-access: true
  mailer:
    port: 25
    auth-methods: 'DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN'
    host: 'mailext.dvbern.ch'
    from: 'kstip@dvbern.ch'
  observability:
    # To use tracing and nice grafana dashboard toggle this and otel.enabled bellow
    enabled: false
  otel:
    enabled: false
    metric:
      enabled: true
    logs:
      enabled: true
  datasource:
    username: '${STIP_DB_USERNAME}'
    db-kind: 'postgresql'
    password: '${STIP_DB_PASSWORD}'
    jdbc:
      url: '${STIP_DB_URL}'
  hibernate-envers:
    object-quoting-strategy: 'QUOTE_ALL_OBJECTS'
  hibernate-orm:
    persistence-xml:
      ignore: true
    log:
      queries-slower-than-ms: 20
      jdbc-warnings: true
    #      sql: true
    multitenant: 'SCHEMA'
    jdbc:
      timezone: 'Europe/Zurich'
    mapping:
      format:
        global: 'ignore'
  default-locale: 'de'
  security:
    jaxrs:
      deny-unannotated-endpoints: true
  jacoco:
    excludes: 'ch/dvbern/stip/generated/**,ch/dvbern/stip/**/Q*,ch/dvbern/stip/**/*MapperImpl*'
  application:
    name: 'stip-api'
  quartz:
    table-prefix: public.QRTZ_
  keycloak:
    devservices:
      enabled: false

  # Keep in Sync with AppLanguages.java
  locales: de_CH,fr_CH
  # For the generation of the classes fot the NESKO SOAP interface
  #  cxf:
  #    codegen:
  #      wsdl2java:
  #        sap-BusinessPartnerCreate-params:
  #          includes: 'wsdl/businesspartner/SST-009-BusinessPartnerCreate.wsdl'
  #          wsdl-location: 'wsdl/businesspartner/SST-009-BusinessPartnerCreate.wsdl'
  #        sap-BusinessPartnerRead-params:
  #          includes: 'wsdl/businesspartner/SST-010-BusinessPartnerRead.wsdl'
  #          wsdl-location: 'wsdl/businesspartner/SST-010-BusinessPartnerRead.wsdl'
  #        sap-BusinessPartnerSearch-params:
  #          includes: 'wsdl/businesspartner/SST-074-BusinessPartnerSearch.wsdl'
  #          wsdl-location: 'wsdl/businesspartner/SST-074-BusinessPartnerSearch.wsdl'
  #        sap-BusinessPartnerChange-params:
  #          includes: 'wsdl/businesspartner/SST-077-BusinessPartnerChange.wsdl'
  #          wsdl-location: 'wsdl/businesspartner/SST-077-BusinessPartnerChange.wsdl'
  #        sap-GetImportStatus-params:
  #          includes: 'wsdl/importstatus/SST-073-GetImportStatus.wsdl'
  #          wsdl-location: 'wsdl/importstatus/SST-073-GetImportStatus.wsdl'
  #        sap-VendorPostingCreate-params:
  #          includes: 'wsdl/vendorposting/SST-003-VendorPostingCreate.wsdl'
  #          wsdl-location: 'wsdl/vendorposting/SST-003-VendorPostingCreate.wsdl'
  #        nesko-params:
  #          includes: 'wsdl/nesko/StipendienAuskunftService.wsdl'
  #          wsdl-location: 'wsdl/nesko/StipendienAuskunftService.wsdl'
  #          bindings:
  #            - 'src/main/resources/wsdl/nesko/binding.xml'

  rest-client:
    swisstopo-plz-api:
      url: 'https://data.geo.admin.ch/api/stac/v0.9/collections/ch.swisstopo-vd.ortschaftenverzeichnis_plz'
    nesko-get-bearer-token-api:
      url: 'https://nesko-int.sv.fin.be.ch/sso/auth/realms/hades-int/protocol/openid-connect'
    swisstopo-rest-api:
      url: 'https://api3.geo.admin.ch/rest/services/api/MapServer'
#   store-type: jdbc-tx
'%dev':
  mp:
    jwt:
      verify:
        issuer: 'NONE'
  quarkus:
    log:
      sentry:
        enabled: false
        debug: true
    http:
      enable-compression: true
      compress-media-types:
        - 'application/json'
    mailer:
      mock: false
    s3:
      endpoint-override: '${STIP_S3_ENDPOINT}'
    swagger-ui:
      oauth2-redirect-url: 'http://localhost:8080/q/swagger-ui/oauth2-redirect.html'
    tls:
      bern:
        trust-store:
          jks:
            alias: 'apps-mercury-ocp-dvbern-ch'
            path: './src/main/resources/development.jks'
            password: 'changeit'
      dv:
        trust-store:
          jks:
            alias: 'apps-mercury-ocp-dvbern-ch'
            path: './src/main/resources/development.jks'
            password: 'changeit'
    oidc:
      bern:
        tls:
          tls-configuration-name: bern
      dv:
        tls:
          tls-configuration-name: dv
    smallrye-openapi:
      security-scheme: 'oauth2-implicit'
      security-scheme-name: 'auth-dev-bern'
      oauth2-implicit-authorization-url: '${STIP_OIDC_AUTH_SERVER}/realms/bern/protocol/openid-connect/auth'
    quartz:
      clustered: false
    liquibase:
      contexts: dev
    keycloak:
      admin-client:
        tls-configuration-name: bern
  kstip:
    pre-signed-request:
      issuer: 'https://stip.kibon.ch'
      expires-in-minutes: 5
    global-adapter:
      pdf:
        typst:
          binary: "typst"
          docker-enabled: true
          docker-image: "ghcr.io/typst/typst:0.15.1"
          # https://docs.oracle.com/javase/tutorial/essential/environment/sysprop.html
          # `user.dir` is the directory from which the jvm was started
          root-path: "${user.dir}/src/main/resources/typst"
          fonts-path: "${user.dir}/src/main/resources/fonts"
    tenant:
      bern:
        frontend:
          urls:
            gs: 'localhost:4200'
            sb: 'localhost:4201'
            soz: 'localhost:4202'
            demo: 'localhost:4203'
'%test':
  mp:
    jwt:
      verify:
        issuer: 'NONE'
  quarkus:
    http:
      test-port: 0
    log:
      ## Uncomment to enable DEBUG logging for WebApplicationException, this debugs every failing request in STDOUT
      # category:
      #   "WebApplicationException":
      #     level: DEBUG
      sentry:
        enabled: false
    antivirus:
      clamav:
        devservice:
          enabled: false
    hibernate-orm:
      database:
        # Hibernate Schema Generation does not work with SCHEMA multi-tenancy
        generation: 'none'
    oidc:
      auth-server-url: '${kstip.oidc.url:replaced-by-test-resource}/realms/quarkus/'
      client-id: '${kstip.oidc.client-id}'
      application-type: service
    s3:
      aws:
        credentials:
          static-provider:
            access-key-id: 'test-key'
            secret-access-key: 'test-secret'
        region: 'eu-central-2'
      devservices:
        enabled: false
        buckets: '${bucket.name}'
    quartz:
      clustered: false
    liquibase:
      contexts: test
  bucket:
    name: 'stip-usercontent-test'
  kstip:
    s3:
      bucket-name: '${bucket.name}'
    upload:
      allowed-mimetypes: 'text/plain,image/png'
    oidc:
      url: 'http://dummy.keycloak'
      frontend-url: 'http://dummy.keycloak'
    pre-signed-request:
      issuer: 'https://stip.kibon.ch'
      expires-in-minutes: 10
      secret: '6a5336d35a192000260cbc9b41a1cb39'
    tenant:
      bern:
        keycloak-admin-client-config:
          server-url: "test"
          client-secret: "test"
      dv:
        keycloak-admin-client-config:
          server-url: "test"
          client-secret: "test"
'%prod':
  quarkus:
    s3:
      endpoint-override: '${STIP_S3_ENDPOINT}'
    antivirus:
      clamav:
        host: '${STIP_CLAMAV_HOST}'
        port: '${STIP_CLAMAV_PORT:3310}'
    quartz:
      clustered: true
      store-type: jdbc-cmt
    liquibase:
      contexts: prod

mp:
  openapi:
    scan:
      disable: true
    extensions:
      servers:
        relative: true
      path: '/openapi.yml'
      enabled: true

openapi:
  ui:
    swaggerHeaderVisibility: 'hidden'
    yamlUrl: '/openapi.yml'
    swaggerUiTheme: 'feeling-blue'
    serverVisibility: 'hidden'

bucket:
  name: '${STIP_S3_BUCKET_NAME}'

org:
  hibernate:
    envers:
      audit_table_suffix: '_aud'
