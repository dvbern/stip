<ng-container *transloco="let t">
  <button
    type="button"
    class="tw:dv-button-icon tw:absolute tw:right-0 tw:top-0 tw:m-1"
    [attr.aria-label]="t('shared.close')"
    (click)="closeSidenav.emit()"
  >
    <span class="material-symbols-rounded">close</span>
  </button>

  <div class="tw:py-2 tw:px-4 tw:font-bold">
    {{ benutzerNameSig() }}
  </div>

  <hr class="tw:my-1 tw:border-t tw:border-dv-border" />
  <div class="tw:px-4">
    <dv-shared-ui-nav-items
      [isMobile]="true"
      [navItemsSig]="navItemsSig()"
      (click)="closeSidenav.emit()"
    ></dv-shared-ui-nav-items>
  </div>

  @if (navigationStore.portalSig()) {
    <hr class="tw:my-1 tw:border-t tw:border-dv-border" />
    <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
    <div class="tw:px-4 tw:mt-2" (keypress.enter)="closeSidenav.emit()" (click)="closeSidenav.emit()">
      <ng-template [cdkPortalOutlet]="navigationStore.portalSig()"></ng-template>
    </div>
  }

  <hr class="tw:my-1 tw:border-t tw:border-dv-border" />
  <dv-shared-ui-nav-menu-items
    [isMobile]="true"
    [navMenuItemsSig]="menuItemsSig()"
    (click)="closeSidenav.emit()"
  ></dv-shared-ui-nav-menu-items>

  <!-- Logout -->
  <div class="tw:ml-4">
    <button type="button" mat-menu-item data-testid="button-logout" (click)="logout()">
      {{ t('shared.menu.logout') }}
    </button>
  </div>

  <hr class="tw:my-1 tw:border-t tw:border-dv-border" />

  <div class="tw:flex tw:justify-center">
    <dv-shared-ui-language-selector [language]="languageSig()" (languageChange)="handleLanguageChangeHeader($event)" />
  </div>
</ng-container>
