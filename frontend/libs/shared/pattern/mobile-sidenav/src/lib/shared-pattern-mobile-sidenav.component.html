<div class="tw:p-4 tw:flex tw:justify-between">
  <div>
    <dv-shared-ui-language-selector [language]="languageSig()" (languageChange)="handleLanguageChangeHeader($event)" />
  </div>
  <button
    type="button"
    class="tw:dv-button"
    [attr.aria-label]="'shared.close' | transloco"
    (click)="closeSidenav.emit()"
  ></button>
</div>

<div class="tw:p-4 tw:flex tw:flex-col">
  <div class="tw:flex tw:flex-col align-items-start">
    <ul class="nav tw:flex-col tw:w-full tw:list-none">
      <li class="tw:mb-6">
        <span class="tw:py-2 tw:px-4">{{ benutzerNameSig() }}</span>
      </li>

      <li>
        <a class="tw:py-2 tw:px-4">Profil</a>
      </li>
      <li>
        <button type="button" class="tw:dv-button tw:py-2 tw:px-4" (click)="logout()">Logout</button>
      </li>
    </ul>
  </div>
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
  <div class="tw:mt-2" (keypress.enter)="closeSidenav.emit()" (click)="closeSidenav.emit()">
    <ng-content></ng-content>
    <ng-template [cdkPortalOutlet]="navigationStore.portalSig()"></ng-template>
  </div>
</div>
