@for (step of stepsViewSig(); track $index; let index = $index) {
  @if (step.prependLine) {
    <hr class="tw:mt-6 tw:mb-6 tw:border-t tw:border-dv-border tw:pb-2" />
  }

  <a
    class="tw:dv-nav-button tw:flex tw:justify-start tw:items-center tw:relative tw:mb-4 tw:w-full"
    [class.active]="step.active()"
    [class.disabled]="step.disabled"
    [class.tw:dv-historized]="isHistorizedSig()"
    [class.tw:pointer-events-none]="!step.route"
    [routerLink]="step.route ?? '#'"
    [queryParamsHandling]="'preserve'"
    [attr.data-testid]="'step-nav-' + step.name"
    (click)="navClicked.emit({})"
  >
    @if (step.hasChanges) {
      <dv-shared-ui-change-indicator displaced="left"></dv-shared-ui-change-indicator>
    }
    <div class="tw:relative tw:flex tw:mr-4 align-middle">
      <i class="material-symbols-rounded">{{ step.iconSymbolName }}</i>
      @if (step.status) {
        <i
          class="validator-indicator material-symbols-rounded tw:absolute"
          [class.tw:text-dv-yellow]="step.status === 'WARNING'"
          [class.tw:text-dv-green]="step.status === 'VALID'"
          [class.tw:text-dv-red]="step.status === 'INVALID'"
        >
          {{ statusIconMap[step.status] }}
        </i>
      }
    </div>
    <span class="text-start">
      {{ step.translationKey | transloco }}
    </span>
  </a>
}
