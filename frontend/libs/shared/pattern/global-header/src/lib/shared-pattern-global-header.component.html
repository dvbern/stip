<!-- HEADER -->
@let tenant = tenantSig()?.identifier;
@if (tenant && tenant !== 'bern') {
  @defer {
    @switch (tenant) {
      @case ('dv') {
        <dv-shared-ui-tenant-styles-dv></dv-shared-ui-tenant-styles-dv>
      }
    }
  }
}

<header
  class="tw:border-b tw:border-dv-border tw:fixed tw:top-0 tw:z-30 tw:w-full"
  [class.shadow-sm]="isScroll && !compactHeader"
  *transloco="let t"
>
  <ng-template #logoOrBackLink>
    @if (logoSig(); as logo) {
      <a routerLink="/">
        <img [src]="logo.src" [alt]="t('shared.logo.tenant', { logo })" class="tw:h-[60px] tw:max-w-[135px]" />
      </a>
    }
  </ng-template>

  <!-- Small screens Header -->
  <div class="tw:px-6 tw:lg:hidden">
    <div class="tw:lg:py-6 tw:flex tw:justify-between tw:gap-2 tw:py-2">
      <ng-container *ngTemplateOutlet="logoOrBackLink"></ng-container>

      <!-- search and burgermenu -->
      <div class="tw:flex tw:items-center tw:gap-2">
        <button
          class="tw:dv-button-icon"
          type="button"
          [attr.aria-label]="t('shared.menu')"
          (click)="openSidenav.emit()"
        >
          <span class="material-symbols-rounded">menu</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Large screens Header -->
  <div class="tw:hidden tw:lg:block">
    <div class="tw:flex tw:justify-between tw:gap-2 tw:p-6">
      <ng-container *ngTemplateOutlet="logoOrBackLink"></ng-container>

      <!-- top left -->
      <dv-shared-ui-nav-items class="tw:ml-6" [navItemsSig]="navItemsSig()"></dv-shared-ui-nav-items>

      <!-- top right -->
      <div class="tw:flex tw:items-center tw:gap-6 tw:overflow-x-hidden">
        <ng-content select="[dvGlobalHeaderRight]"></ng-content>
        <button
          type="button"
          class="tw:dv-nav-button tw:flex tw:items-center tw:pr-1"
          data-testid="header-nav-user-menu"
          [matMenuTriggerFor]="profileMenu"
        >
          <span class="tw:text-ellipsis tw:whitespace-nowrap">{{ benutzerNameSig() }}</span>
          <i class="material-symbols-rounded tw:ml-2">expand_more</i>
        </button>

        <mat-menu #profileMenu="matMenu" xPosition="before">
          <dv-shared-ui-nav-menu-items [navMenuItemsSig]="menuItemsSig()"></dv-shared-ui-nav-menu-items>

          <!-- Logout -->
          <button type="button" data-testid="button-logout" mat-menu-item (click)="logout()">
            {{ t('shared.menu.logout') }}
          </button>

          <!-- Language Selector -->
          <hr class="tw:my-1 tw:border-t tw:border-dv-border" />
          <dv-shared-ui-language-selector
            class="tw:flex tw:justify-center tw:px-2"
            [language]="languageSig()"
            (languageChange)="handleLanguageChangeHeader($event)"
          />
        </mat-menu>
      </div>
    </div>
  </div>
</header>
