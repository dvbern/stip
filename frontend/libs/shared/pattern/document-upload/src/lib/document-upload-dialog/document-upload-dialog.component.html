<div class="tw:md:p-6 tw:p-4" *dvTranslocoShared="let t">
  @let info = data.options.info;
  <h1
    class="tw:text-xl tw:font-semibold tw:whitespace-pre-wrap tw:mb-4"
    [innerHTML]="info.type === 'TEXT' ? info.title : t(info.title)"
  ></h1>

  <button type="button" class="tw:dv-button-icon tw:absolute tw:self-start tw:right-0 tw:top-0" (click)="closeDialog()">
    <span class="material-symbols-rounded">close</span>
  </button>

  @if (info.description) {
    <div
      class="tw:whitespace-pre-wrap tw:[&_ul]:list-disc tw:[&_ul]:pl-5 tw:[&_ol]:list-decimal tw:[&_ol]:pl-5 tw:[&_li]:ml-2"
      [innerHTML]="info.type === 'TEXT' ? info.description : t(info.description)"
    ></div>
  }

  @if (showUplaodSig()) {
    <dv-shared-ui-drop-file
      class="tw:flex tw:items-center tw:flex-col tw:rounded-lg tw:top-3 tw:mt-6 border tw:border-2 tw:bg-white tw:p-4"
      [disabled]="data.store.isLoading()"
      [class.rounded-bottom-3]="!data.store.hasEntriesSig()"
      (filesDropped)="handleMultipleDocumentsAdded($event)"
    >
      <label class="upload" [class.disabled]="data.store.isLoading()">
        <div
          class="tw:text-dv-gray tw:md:block tw:hidden tw:my-6 tw:text-center"
          [innerHTML]="t('shared.file.dropZone')"
        ></div>
        <button (click)="fileInput.click()" type="button" class="tw:dv-button-outline">
          {{ t('shared.file.upload') }}
        </button>
        <input
          #fileInput
          class="cdk-visually-hidden tw:mb-2"
          type="file"
          tabindex="-1"
          data-testid="file-input"
          [attr.accept]="data.options.allowTypes"
          [disabled]="data.store.isLoading()"
          (change)="handleFilInputEvent($event.target)"
        />
      </label>
    </dv-shared-ui-drop-file>
  }

  @if (data.store.state().errorKey; as errorKey) {
    <mat-error>{{ t($any(errorKey)) }}</mat-error>
  }

  <dv-shared-pattern-document-upload-list
    [uploadViewSig]="uploadViewSig()"
    [storeSig]="data.store"
    (cancelUpload)="data.store.cancelDocumentUpload($event.dokumentId, data.options)"
    (removeUpload)="data.store.removeDocument($event.dokumentId, data.options)"
  ></dv-shared-pattern-document-upload-list>
</div>
@if (uploadViewSig().isSachbearbeitungApp && uploadViewSig().dokumentModel.art === 'GESUCH_DOKUMENT') {
  <div class="tw:border-t-2 tw:border-dv-border"></div>
  <div class="tw:md:p-6 tw:p-4">
    <dv-shared-pattern-document-upload-approval
      [uploadViewSig]="uploadViewSig()"
    ></dv-shared-pattern-document-upload-approval>
  </div>
}
