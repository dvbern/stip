<button
  class="tw:dv-button-outline tw:h-full tw:text-xl"
  type="button"
  [attr.aria-label]="'shared.dokumente.upload' | transloco"
  [attr.data-testid]="'button-document-upload-' + optionsSig().dokument.dokumentTyp"
  (click)="openDialog()"
>
  <span class="material-symbols-rounded">{{ iconSig() }}</span>
</button>
@if (mainDocumentSig(); as dokument) {
  <div class="tw:text-xl tw:absolute indicator tw:rounded-full tw:bg-white tw:pointer-events-none shadow">
    <dv-shared-ui-icon-chip
      class="tw:text-2xl!"
      [class.spin]="dokument.state === 'uploading'"
      [ngClass]="dokument.twColor.bg"
    >
      <i class="material-symbols-rounded fs-6 tw:text-base!" [ngClass]="dokument.twColor.color">
        {{ dokument.theme.icon }}
      </i>
    </dv-shared-ui-icon-chip>
  </div>
}
