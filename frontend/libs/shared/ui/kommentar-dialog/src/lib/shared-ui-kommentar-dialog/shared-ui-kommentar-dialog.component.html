<section class="tw:flex tw:flex-col tw:relative tw:p-6 tw:rounded-lg">
  <button
    type="button"
    (click)="cancel()"
    class="tw:dv-button-icon tw:absolute tw:top-0 tw:right-0 tw:m-1"
    [attr.aria-label]="'shared.close' | transloco"
  >
    <span class="material-symbols-rounded">close</span>
  </button>

  <h1 class="tw:mb-6 tw:flex tw:font-semibold tw:text-lg">
    {{ dialogData.titleKey | transloco }}
  </h1>
  @if (dialogData.messageKey) {
    <p class="content tw:mb-0" [innerHTML]="dialogData.messageKey | transloco"></p>
  }

  <form [formGroup]="form" class="tw:flex tw:flex-col tw:mt-6" data-testid="form-kommentar-dialog-form" novalidate>
    <mat-form-field dvSharedUiFormField class="tw:w-full">
      @if (dialogData.labelKey; as commentLabel) {
        <mat-label>{{ commentLabel | transloco }}</mat-label>
      }
      <textarea
        rows="4"
        matInput
        [dvMaxLength]="'large'"
        formControlName="kommentar"
        data-testid="form-kommentar-dialog-kommentar"
        [placeholder]="dialogData.placeholderKey | transloco"
      ></textarea>
      <mat-error *dvSharedUiFormMessageError="'required'">
        {{ 'shared.form.error.required' | transloco }}
      </mat-error>
    </mat-form-field>

    <div class="tw:flex tw:mt-6 tw:justify-between">
      <button type="button" data-testid="dialog-cancel" class="tw:dv-button-outline" (click)="cancel()">
        {{ 'shared.cancel' | transloco }}
      </button>
      <button
        type="submit"
        [disabled]="form.invalid"
        data-testid="dialog-confirm"
        class="tw:dv-button-main-primary tw:ml-2"
        (click)="confirm()"
      >
        {{ dialogData.confirmKey | transloco }}
      </button>
    </div>
  </form>
</section>
