<div class="tw:flex tw:gap-1 tw:items-center text-nowrap">
  @switch (type) {
    @case ('success') {
      <i class="material-symbols-rounded tw:text-xl">check_circle</i>
    }
    @case ('warning') {
      <i class="material-symbols-rounded tw:text-xl">error</i>
    }
    @case ('danger') {
      <i class="material-symbols-rounded tw:text-xl">warning</i>
    }
    @case ('info') {
      <i class="material-symbols-rounded tw:text-xl">schedule</i>
    }
  }
  <ng-content></ng-content>
</div>
