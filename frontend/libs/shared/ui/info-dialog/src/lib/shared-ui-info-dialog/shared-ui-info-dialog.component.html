<section class="tw:relative tw:flex tw:flex-col tw:rounded-sm tw:@container" *dvTranslocoShared="let t">
  <div class="tw:p-6 tw:@max-md:p-3">
    <button
      type="button"
      (click)="close()"
      class="tw:dv-button-icon tw:absolute tw:inset-e-0 tw:top-0 tw:m-1!"
      [attr.aria-label]="t('shared.close')"
    >
      <span class="material-symbols-rounded">close</span>
    </button>
    <h1 class="tw:mb-4 tw:flex tw:text-lg tw:xl:pr-5 tw:font-semibold tw:wrap-anywhere">
      <span class="tw:text-dv-blue material-symbols-rounded tw:mr-2">info</span>
      {{ dialogData.type === 'plain' ? dialogData.title : t(dialogData.titleKey, dialogData.titleParams) }}
    </h1>
    @if (dialogData.type === 'plain') {
      <p class="tw:whitespace-pre-line">
        {{ dialogData.message }}
      </p>
    } @else {
      <p class="tw:mb-4" [innerHTML]="t(dialogData.messageKey, dialogData.messageParams)"></p>
    }
  </div>
</section>
