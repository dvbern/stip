<section class="tw:relative tw:flex tw:flex-col tw:rounded-sm tw:p-4">
  <button
    type="button"
    (click)="close()"
    class="tw:dv-button-icon tw:absolute tw:end-0 tw:top-0 tw:!m-1"
    [attr.aria-label]="'shared.close' | transloco"
  >
    <span class="material-symbols-rounded">close</span>
  </button>
  <h1 class="tw:mb-4 tw:flex tw:text-lg tw:xl:pr-5 tw:font-semibold">
    <span class="tw:text-dv-blue material-symbols-rounded tw:mr-2">info</span>
    {{ dialogData.titleKey | transloco: dialogData.titleParams }}
  </h1>
  <p class="tw:mb-4" [innerHTML]="dialogData.messageKey | transloco: dialogData.messageParams"></p>
</section>
