<button
  type="button"
  class="tw:m-2 tw:absolute tw:top-0 tw:right-0"
  [attr.aria-label]="'shared.dialog.unsavedChanges.cancel' | transloco"
  (click)="cancel()"
>
  <span class="material-symbols-rounded">close</span>
</button>
<div class="tw:flex tw:flex-col tw:p-6">
  <h3 class="tw:mb-3 tw:font-semibold tw:text-2xl">
    {{ dialogData?.title ?? 'shared.ui.confirmDialog.title' | transloco: dialogData?.translationObject ?? {} }}
  </h3>
  <div
    [innerHTML]="
      dialogData?.message ?? 'shared.ui.confirmDialog.message' | transloco: dialogData?.translationObject ?? {}
    "
  ></div>
  <div class="tw:flex tw:mt-6 tw:justify-end">
    <button type="button" class="tw:dv-button-outline" (click)="cancel()" data-testid="dialog-cancel">
      {{ dialogData?.cancelText ?? 'shared.ui.confirmDialog.cancel' | transloco }}
    </button>
    <button type="button" class="tw:dv-button-main-primary tw:ml-2" (click)="confirm()" data-testid="dialog-confirm">
      {{ dialogData?.confirmText ?? 'shared.ui.confirmDialog.confirm' | transloco }}
    </button>
  </div>
</div>
