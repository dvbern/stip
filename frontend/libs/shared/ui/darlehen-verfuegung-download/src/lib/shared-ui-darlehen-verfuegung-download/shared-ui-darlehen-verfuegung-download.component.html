<ng-container *dvTranslocoShared="let t">
  @if (darlehenSig()?.verfuegung; as verfuegung) {
    <button
      type="button"
      class="tw:dv-button tw:flex tw:max-w-full tw:p-0 tw:underline tw:text-base tw:font-normal"
      [dvDownloadButton]="{
        type: 'darlehen',
        id: verfuegung.id,
      }"
    >
      <span class="tw:truncate tw:text-lg/none" [matTooltip]="verfuegung.filename">{{
        t('shared.form.darlehen.verfuegung')
      }}</span>
      <span class="material-symbols-rounded tw:ml-1 tw:align-middle tw:text-base/none!">download</span>
    </button>
  }
</ng-container>
