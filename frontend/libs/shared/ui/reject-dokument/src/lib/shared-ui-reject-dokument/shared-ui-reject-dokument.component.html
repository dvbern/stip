<section class="tw:flex tw:flex-col tw:relative tw:p-6 tw:rounded-lg">
  <button
    type="button"
    (click)="cancel()"
    class="tw:dv-button-icon tw:absolute tw:top-0 tw:right-0 tw:m-1"
    [attr.aria-label]="'shared.close' | transloco"
  >
    <span class="material-symbols-rounded">close</span>
  </button>

  <h1 class="title h5 tw:mb-6 tw:flex">
    {{ 'shared.dokumente.reject.title' | transloco }}
  </h1>
  <p class="content tw:mb-0" [innerHTML]="'shared.dokumente.reject.message' | transloco"></p>

  <form [formGroup]="form" class="tw:mt-6" novalidate>
    <mat-form-field dvSharedUiFormField class="tw:col-span-12">
      <textarea
        rows="4"
        matInput
        [dvMaxLength]="'large'"
        formControlName="kommentar"
        [placeholder]="'shared.dokumente.reject.placeholder' | transloco"
      ></textarea>
      <mat-error *dvSharedUiFormMessageError="'required'">
        {{ 'shared.form.error.required' | transloco }}
      </mat-error>
    </mat-form-field>

    <div class="tw:flex tw:mt-6 tw:justify-between">
      <button type="button" class="tw:dv-button-outline" (click)="cancel()">
        {{ 'shared.cancel' | transloco }}
      </button>
      <button
        type="submit"
        [disabled]="form.invalid"
        class="tw:dv-button-main-primary tw:ml-2"
        (click)="rejectDocument()"
      >
        {{ 'shared.dokumente.reject.action' | transloco }}
      </button>
    </div>
  </form>
</section>
