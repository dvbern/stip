<div
  class="tw:flex tw:grow tw:flex-col tw:justify-center tw:items-center tw:lg:col-span-9"
  [class.compact]="type !== 'spinner'"
  [class.tw:mt-6]="type === 'spinner'"
  [class.overlay]="overlay"
  *transloco="let t"
>
  <div class="spinner" [class.tw:mb-4]="type === 'spinner'" [class.tw:mb-1]="type === 'compact'"></div>
  @if (type !== 'icon') {
    @if (loadingTextKey; as textKey) {
      <div class="spinner-text" [class.fs-7]="type === 'compact'">{{ t(textKey) }}</div>
    }
  }
</div>
