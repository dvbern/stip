<div class="stepper-navigation tw:flex tw:items-center tw:min-h-6 tw:mt-1">
  <div class="tw:w-8 tw:flex tw:justify-start tw:items-center">
    @if (prevStepVisible) {
      <button
        type="button"
        class="tw:dv-button tw:text-dv-blue tw:p-0.5 tw:flex tw:justify-start tw:items-center"
        (click)="prevStep.emit()"
        data-testid="stepper-previous"
      >
        <i class="material-symbols-rounded" aria-hidden="true">west</i>
        <span class="cdk-visually-hidden">{{ 'shared.form.previous' | transloco }}</span>
      </button>
    }
  </div>

  <div class="tw:flex-1 tw:flex tw:justify-center tw:items-center">
    @if (currentStep !== null && totalSteps !== null) {
      <span class="tw:text-sm tw:font-medium tw:text-dv-blue" data-testid="stepper-progress">
        {{ currentStep }} / {{ totalSteps }}
      </span>
    }
  </div>

  <div class="tw:w-8 tw:flex tw:justify-end tw:items-center">
    @if (nextStepVisible) {
      <button
        type="button"
        class="tw:dv-button tw:text-dv-blue tw:p-0.5 tw:flex tw:justify-start tw:items-center"
        (click)="nextStep.emit()"
        data-testid="stepper-next"
      >
        <i class="material-symbols-rounded" aria-hidden="true">east</i>
        <span class="cdk-visually-hidden">{{ 'shared.form.next' | transloco }}</span>
      </button>
    }
  </div>
</div>
