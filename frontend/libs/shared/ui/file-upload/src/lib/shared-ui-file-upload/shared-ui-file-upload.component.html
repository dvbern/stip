<ng-container *dvTranslocoShared="let t">
  <dv-shared-ui-drop-file class="tw:rounded-lg tw:border-2 tw:bg-white tw:shadow-sm tw:grow">
    <label class="tw:flex tw:flex-col tw:items-center tw:p-4 tw:w-full tw:text-center tw:cursor-pointer">
      <div
        class="tw:text-dv-gray tw:md:block tw:hidden tw:my-6 tw:text-center"
        [innerHTML]="t('shared.file.dropZone')"
      ></div>
      <button (click)="fileInput.click()" type="button" class="tw:dv-button-outline btn-outline-primary">
        {{ t('shared.file.upload') }}
      </button>
      <input
        #fileInput
        [formControl]="fileControl"
        class="cdk-visually-hidden tw:mb-2"
        type="file"
        tabindex="-1"
        data-testid="file-input"
        [attr.accept]="allowedFileTypesSig()"
        (change)="updateFileList($event)"
      />
    </label>
  </dv-shared-ui-drop-file>
  @let file = latestValueSig();
  @if (file) {
    <div class="tw:flex tw:items-center tw:gap-2">
      <span class="tw:truncate" [title]="file.name">{{ file.name }}</span>
      <button
        type="button"
        class="tw:dv-button-icon tw:ml-2 tw:h-auto tw:w-auto tw:self-end tw:shrink-0"
        [attr.aria-label]="t('shared.form.delete')"
        (click)="resetSelectedFile()"
      >
        <span class="material-symbols-rounded tw:text-dv-gray tw:!text-xl/none align-middle">delete</span>
      </button>
    </div>
  }
  <div class="group-errors tw:mb-[3px] tw:text-sm">
    @if (ngControl?.control?.invalid && ngControl?.control?.touched && fileInput.files?.length === 0) {
      <mat-error>
        {{ t('shared.form.error.required') }}
      </mat-error>
    }
  </div>
</ng-container>
