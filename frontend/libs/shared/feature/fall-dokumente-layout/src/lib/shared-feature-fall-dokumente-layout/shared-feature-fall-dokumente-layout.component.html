<nav mat-tab-nav-bar [tabPanel]="tabPanel" class="tw:mt-6 nav-style-tabs" [disablePagination]="true">
  @for (tab of tabsSig(); track tab.name) {
    <a
      mat-tab-link
      [routerLink]="[tab.name]"
      [active]="tab.active"
      class="tw:dv-nav-button tw:bg-white! tw:not-[.active]:border-dv-border! tw:border!"
      [class.active]="tab.active"
    >
      {{ 'shared.fallDokumente.tabs.' + tab.name | transloco }}
    </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
