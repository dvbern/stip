<div
  class="tw:border tw:border-dv-border tw:rounded-xl tw:bg-white tw:dv-container tw:dv-pass-height"
  *dvTranslocoShared="let t"
>
  <h1 class="tw:flex tw:dv-page-title tw:items-center" data-testid="fall-dokumente-title">
    <dv-shared-ui-icon-chip class="tw:mr-4">
      <i class="material-symbols-rounded tw:text-dv-blue">archive</i>
    </dv-shared-ui-icon-chip>
    <span>{{ t('shared.fallDokumente.title') }}</span>
  </h1>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="nav-style-tabs" [disablePagination]="true">
    @for (tab of tabsSig(); track tab.name) {
      <a
        mat-tab-link
        [routerLink]="[tab.name]"
        [active]="tab.active"
        class="tw:dv-nav-button tw:bg-white tw:not-[.active]:border-dv-border tw:border! tw:flex-0! tw:basis-1/4!"
        [class.active]="tab.active"
      >
        {{ t(`shared.fallDokumente.tabs.${tab.name}`) }}
      </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel class="">
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</div>
