<div class="tw:flex tw:h-full" *dvTranslocoShared="let t">
  <div
    class="tw:w-full tw:lg:w-[320px] tw:border-r tw:border-dv-border tw:p-6 tw:bg-white tw:h-full tw:overflow-y-auto tw:shrink-0"
    [ngClass]="{ 'tw:hidden tw:lg:block': !!darlehenIdSig() }"
  >
    <dv-shared-ui-darlehen-menu
      [darlehenListSig]="darlehenStore.darlehenListViewSig().list"
      [fallIdSig]="fallIdSig()"
    ></dv-shared-ui-darlehen-menu>
  </div>

  <div class="tw:overflow-y-auto tw:w-full" [ngClass]="{ 'tw:hidden tw:lg:block': !darlehenIdSig() }">
    <div class="tw:relative tw:justify-between tw:dv-container tw:dv-scroll-space">
      <!-- <button
        type="button"
        class="tw:lg:hidden tw:dv-button-ghost tw:flex tw:items-center tw:gap-1 tw:mb-4"
        (click)="toDarlehenOverview()"
      >
        <i class="material-symbols-rounded">arrow_back</i>
        {{ t('shared.form.back') }}
      </button> -->
      <!-- link -->
      <a
        class="tw:lg:hidden tw:dv-button-ghost tw:flex tw:items-center tw:gap-1 tw:mb-4"
        [routerLink]="['/gesuch', gesuchIdSig(), 'darlehen', 'fall', fallIdSig()]"
      >
        <i class="material-symbols-rounded">arrow_back</i>
        {{ t('shared.form.back') }}
      </a>

      <h1 class="tw:flex tw:justify-between tw:items-center tw:w-1/2 tw:text-3xl tw:font-bold">
        {{ t('shared.darlehen.title') }}
        <dv-shared-ui-darlehen-verfuegung-download
          [darlehenSig]="darlehenStore.cachedDarlehen().data"
        ></dv-shared-ui-darlehen-verfuegung-download>
      </h1>
      <dv-shared-pattern-darlehen-form
        (formIsUnsavedSig)="hasUnsavedChanges = $event"
        (darlehenDeletedSig)="redirectToHome()"
        (darlehenUpdatedSig)="reloadFallHeader()"
      ></dv-shared-pattern-darlehen-form>
    </div>
  </div>
</div>
