<div class="tw:border tw:border-dv-border tw:rounded-xl tw:bg-white tw:dv-pass-height">
  <h3
    class="tw:flex tw:items-center tw:text-2xl tw:font-semibold tw:border-b tw:border-dv-border tw:p-6"
    data-testid="nachrichten-title"
  >
    <dv-shared-ui-icon-chip style="background-color: #e6f9fd; color: #07c6e0" class="tw:mr-2">
      <i class="material-symbols-rounded tw:text-lg!">mail</i>
    </dv-shared-ui-icon-chip>
    <span>{{ 'shared.nachrichten.title' | transloco }}</span>
  </h3>
  <div class="tw:flex tw:grow">
    <dv-shared-ui-notifications
      class="tw:basis-1/3 tw:p-6"
      [notifications]="notificationStore.notificationListViewSig()"
      [selectedNotificationId]="notificationStore.selectedNotificationId()"
    ></dv-shared-ui-notifications>

    <div class="tw:basis-2/3 tw:p-6 tw:border-l tw:border-dv-border">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
