<div class="tw:border tw:border-dv-border tw:rounded-xl tw:bg-white tw:flex tw:flex-col tw:flex-1 tw:overflow-hidden">
  <h3
    class="tw:flex tw:items-center tw:text-2xl tw:font-semibold tw:border-b tw:border-dv-border tw:dv-container"
    data-testid="nachrichten-title"
  >
    <dv-shared-ui-icon-chip class="tw:mr-2 tw:dv-icon-chip-info">
      <i class="material-symbols-rounded tw:text-lg!">mail</i>
    </dv-shared-ui-icon-chip>
    <span>{{ 'shared.nachrichten.title' | transloco }}</span>
  </h3>
  <div class="tw:flex tw:flex-1 tw:min-h-0">
    <dv-shared-ui-notifications
      class="tw:w-full tw:md:basis-1/3 tw:dv-container tw:md:border-r tw:border-dv-border tw:overflow-y-auto"
      [ngClass]="{ 'tw:hidden tw:md:block': outlet.isActivated }"
      [notifications]="notificationStore.notificationListViewSig()"
      [selectedNotificationId]="notificationStore.selectedNotificationId()"
    ></dv-shared-ui-notifications>

    <div
      class="tw:w-full tw:md:basis-2/3 tw:dv-container tw:overflow-y-auto"
      [ngClass]="{ 'tw:hidden tw:md:block': !outlet.isActivated }"
    >
      <router-outlet #outlet="outlet"></router-outlet>
    </div>
  </div>
</div>
