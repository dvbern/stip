<section class="tw:relative tw:flex tw:flex-col tw:rounded-sm tw:p-6">
  <button
    type="button"
    (click)="close()"
    class="tw:dv-button-icon tw:absolute tw:end-0 tw:top-0 tw:m-1"
    [attr.aria-label]="'shared.close' | transloco"
  >
    <span class="material-symbols-rounded">close</span>
  </button>
  <h1 class="tw:text-xl tw:font-semibold tw:mb-8">
    {{ 'shared.dialog.einreichedatum-aendern.title' | transloco }}
  </h1>

  <form [formGroup]="form" (ngSubmit)="einreichedatumAendern()">
    <mat-form-field dvSharedUiFormField class="tw:w-full">
      <mat-label>{{ 'shared.dialog.einreichedatum-aendern.einreichedatum.label' | transloco }}</mat-label>
      <input
        formControlName="einreichedatum"
        data-testid="form-einreichedatum"
        matInput
        [dvMaxLength]="'small'"
        [min]="dialogData.minDate"
        [max]="dialogData.maxDate"
        [matDatepicker]="einreichedatumDatepicker"
      />
      <mat-datepicker-toggle matIconSuffix [for]="einreichedatumDatepicker"></mat-datepicker-toggle>
      <mat-datepicker #einreichedatumDatepicker></mat-datepicker>
      <mat-error *dvSharedUiFormMessageError="'required'">
        {{ 'shared.form.error.required' | transloco }}
      </mat-error>
    </mat-form-field>
    <div class="tw:mt-10 tw:flex tw:justify-between tw:gap-4">
      <button type="button" class="tw:dv-button-outline" (click)="close()" data-testid="dialog-cancel">
        {{ 'shared.cancel' | transloco }}
      </button>
      <button type="submit" class="tw:dv-button-main-primary" data-testid="dialog-ok" [disabled]="form.invalid">
        {{ 'shared.accept' | transloco }}
      </button>
    </div>
  </form>
</section>
