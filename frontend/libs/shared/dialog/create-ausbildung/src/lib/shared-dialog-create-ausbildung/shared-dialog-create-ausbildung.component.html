<section class="tw:relative tw:flex tw:max-h-dvh tw:flex-col tw:overflow-y-auto tw:rounded-lg tw:p-6">
  <button
    type="button"
    (click)="cancel()"
    class="tw:dv-button-icon tw:absolute tw:right-0 tw:top-0 tw:m-1"
    [attr.aria-label]="'shared.close' | transloco"
  >
    <span class="material-symbols-rounded">close</span>
  </button>

  <h1 class="tw:text-3xl! tw:mb-8! tw:font-bold!">
    {{ 'shared.ausbildung.dialog.title' | transloco }}
  </h1>

  <dv-shared-feature-ausbildung
    [dialogDataSig]="dialogData"
    (ausbildungSaved)="savedSuccess($event)"
  ></dv-shared-feature-ausbildung>
</section>
