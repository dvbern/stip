<section
  class="tw:relative tw:flex tw:max-h-dvh tw:flex-col tw:overflow-y-auto tw:rounded-lg tw:p-8"
  *dvTranslocoShared="let t"
>
  <button
    type="button"
    (click)="cancel()"
    class="tw:dv-button-icon tw:absolute tw:right-0 tw:top-0 tw:m-1"
    [attr.aria-label]="t('shared.close')"
  >
    <span class="material-symbols-rounded">close</span>
  </button>

  <h1 class="tw:dv-page-title tw:mb-4">
    {{ t('shared.user.consent.dialog.title') }}
  </h1>

  <div [innerHTML]="t('shared.user.consent.dialog.text')"></div>

  <div class="tw:mt-5 tw:flex tw:justify-between">
    <button type="button" class="tw:dv-button-outline" (click)="cancel()">
      @if (dialogData.nutzungsbedingungenAkzeptiert) {
        {{ t('shared.close') }}
      } @else {
        {{ t('shared.cancel') }}
      }
    </button>
    @if (!dialogData.nutzungsbedingungenAkzeptiert) {
      <button type="button" class="tw:dv-button-main-primary tw:ml-2" (click)="accept()">
        {{ t('shared.user.consent.dialog.accept') }}
      </button>
    }
  </div>
</section>
