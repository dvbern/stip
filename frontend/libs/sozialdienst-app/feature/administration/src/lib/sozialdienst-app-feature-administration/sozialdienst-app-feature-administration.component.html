<ng-container *transloco="let t">
  <ng-template #navigation cdkPortal>
    <div class="sidenav tw:p-6">
      @for (option of options; track $index) {
        @let isActive = route.isActive(option.route, false);
        <a
          *dvHasRoles="option.allowedRoles"
          type="button"
          class="tw:dv-nav-button tw:flex tw:justify-start tw:items-center fw-normal tw:mb-4 tw:w-full"
          [class.btn-light]="!isActive"
          [class.shadow-none]="!isActive"
          [routerLink]="['/', 'administration', option.route]"
          routerLinkActive="active"
          [attr.data-testid]="'option-nav-' + option.route"
        >
          <i class="material-symbols-rounded tw:mr-4">{{ option.iconSymbolName }}</i>
          <span class="text-start">
            {{ t(option.translationKey) }}
          </span>
        </a>
      }
    </div>
  </ng-template>

  <div class="tw:flex tw:h-full">
    <!-- left step nav (Desktop) -->
    <div class="tw:hidden tw:lg:block tw:border-r tw:border-dv-border tw:bg-white">
      <ng-container *ngTemplateOutlet="navigation"></ng-container>
    </div>
    <div class="pt-lg-4 px-lg-4 tw:dv-container tw:dv-pass-height">
      <!-- step header (mobile) -->
      <div
        class="tw:flex tw:items-center tw:justify-between border-bottom tw:lg:hidden tw:mt-4 tw:mb-6 border-1 tw:pb-4"
      >
        <ng-container *ngTemplateOutlet="navigation"></ng-container>
      </div>

      <!-- title (desktop) -->
      @if (option) {
        <div class="tw:hidden tw:lg:flex tw:justify-start tw:items-center">
          @if (option.type === 'PARENT') {
            <dv-shared-ui-icon-chip class="step-icon tw:mr-4">
              <i class="material-symbols-rounded title-icon">{{ option.iconSymbolName }}</i>
            </dv-shared-ui-icon-chip>
          } @else {
            <a
              [routerLink]="option.parentRoute"
              class="btn btn-link text-decoration-none fw-normal tw:flex tw:items-center tw:mr-2 tw:border-none tw:p-2"
              data-testid="gesuch-step-nav-overview"
            >
              <i class="material-symbols-rounded tw:mr-2 text-black">arrow_back</i>
            </a>
          }

          <h2 class="fw-bold m-0" data-testid="step-title">
            {{ t(option.titleTranslationKey) }}
            <ng-container *ngTemplateOutlet="headerService.suffixSig()"></ng-container>
          </h2>
        </div>
      }

      <div>
        <dv-shared-ui-router-outlet-wrapper
          attribute="option"
          (data)="option = $event"
        ></dv-shared-ui-router-outlet-wrapper>
      </div>
    </div>
  </div>
</ng-container>
