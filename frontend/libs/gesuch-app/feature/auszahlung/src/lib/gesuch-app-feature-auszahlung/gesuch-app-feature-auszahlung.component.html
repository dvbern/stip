<ng-container *transloco="let t">
  <div class="tw:relative tw:my-12 tw:justify-between container">
    <h1 class="tw:!mb-8">
      {{ t('shared.auszahlung.title') }}
    </h1>
    <dv-shared-ui-auszahlung
      [auszahlungViewSig]="auszahlungViewSig()"
      (backTriggered)="handleBack('/')"
      (saveTriggered)="handleSave($event, '/')"
      (formIsUnsaved)="hasUnsavedChanges = $event"
    ></dv-shared-ui-auszahlung>
  </div>

  <!-- todo: MOBILE NAV -->
  <!-- <div dvHeaderMobileAddons></div>
  <div dvMobileNavContent></div> -->
</ng-container>
