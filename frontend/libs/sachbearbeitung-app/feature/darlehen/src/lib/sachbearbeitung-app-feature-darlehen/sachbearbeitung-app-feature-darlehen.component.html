<div class="tw:flex tw:h-full" *transloco="let t">
  <div class="tw:hidden tw:lg:block tw:border-r tw:border-dv-border tw:p-6 tw:bg-white tw:overflow-y-auto tw:w-[320px]">
    <dv-shared-ui-darlehen-menu
      [darlehenListSig]="darlehenStore.darlehenListSbViewSig().list"
      [canCreateDarlehenSig]="false"
      [idTypeSig]="['gesuch', gesuchIdSig()]"
    ></dv-shared-ui-darlehen-menu>
  </div>

  <div class="tw:relative tw:p-6 tw:dv-pass-height tw:bg-white">
    <h1 class="tw:flex tw:justify-between tw:items-center tw:w-1/2 tw:mb-6">
      <span class="tw:text-3xl tw:font-bold">{{ t('shared.darlehen.title') }}</span>
      <dv-shared-ui-darlehen-verfuegung-download
        [darlehenSig]="darlehenStore.cachedDarlehen().data"
      ></dv-shared-ui-darlehen-verfuegung-download>
    </h1>
    <dv-shared-pattern-darlehen-form
      (darlehenUpdatedSig)="reloadDarlehenList()"
      (formIsUnsavedSig)="hasUnsavedChanges = $event"
    ></dv-shared-pattern-darlehen-form>
  </div>
</div>
