<!-- todo: change to correct transloco directive -->
<ng-container *transloco="let t">
  <div class="tw:relative tw:my-12 tw:justify-between container">
    <h1 class="tw:flex tw:!mb-8 tw:justify-between tw:items-center tw:w-1/2">
      {{ t('shared.darlehen.title') }}
      <dv-shared-ui-darlehen-verfuegung-download
        [darlehenSig]="darlehenStore.cachedDarlehen().data"
      ></dv-shared-ui-darlehen-verfuegung-download>
    </h1>
    <dv-shared-pattern-darlehen-form
      (darlehenUpdatedSig)="reloadDarlehenList()"
      (formIsUnsavedSig)="hasUnsavedChanges = $event"
    ></dv-shared-pattern-darlehen-form>
  </div>
</ng-container>
