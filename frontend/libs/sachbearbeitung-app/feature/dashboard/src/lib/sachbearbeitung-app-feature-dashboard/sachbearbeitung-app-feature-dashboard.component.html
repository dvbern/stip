<ng-container *transloco="let t">
  <!-- <mat-slide-toggle class=""> Slide me! </mat-slide-toggle> -->
  <nav class="tw:mt-6" mat-tab-nav-bar [tabPanel]="tabPanel" [disablePagination]="true">
    @for (tab of tabsSig(); track tab.name) {
      <a
        mat-tab-link
        [routerLink]="tab.route"
        [queryParams]="tab.queryParams"
        [queryParamsHandling]="tab.queryParamsHandling"
        class="btn btn-nav tw:rounded-b-none! tw:border! tw:border-gray-300! tw:border-b-0! form-tabs"
        [active]="tab.active"
        [class.active]="tab.active"
      >
        {{ t(`sachbearbeitung-app.dashboard.tabs.${tab.name}`) }}
      </a>
    }
  </nav>

  <mat-tab-nav-panel
    class="tw:dv-pass-height tw:border tw:border-gray-300 tw:mb-4 tw:rounded-b-xl tw:rounded-tr-xl"
    #tabPanel
  >
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</ng-container>
