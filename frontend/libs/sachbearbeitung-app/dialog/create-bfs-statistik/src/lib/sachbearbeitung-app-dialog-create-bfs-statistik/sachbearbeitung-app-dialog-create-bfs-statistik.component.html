<section class="tw:relative tw:flex tw:flex-col tw:rounded-sm tw:p-12" *dvTranslocoSb="let t">
  <button
    type="button"
    (click)="cancel()"
    class="tw:dv-button-icon tw:absolute tw:end-0 tw:top-0 tw:m-1"
    [attr.aria-label]="t('shared.close')"
  >
    <span class="material-symbols-rounded">close</span>
  </button>
  <h1 class="tw:mb-8 tw:text-xl tw:font-semibold">
    {{ t('sachbearbeitung-app.admin.bfs-statistik.createDialog.title') }}
  </h1>

  <form [formGroup]="form" (ngSubmit)="confirm()" class="tw:mt-5 tw:flex tw:w-full tw:flex-col tw:gap-4">
    <mat-form-field dvSharedUiFormField class="tw:w-full">
      <mat-label>{{ t('sachbearbeitung-app.admin.bfs-statistik.createDialog.year') }}</mat-label>
      <input matInput [formControl]="form.controls.year" [maskito]="maskitoYear" />
      <mat-error *dvSharedUiFormMessageError="'required'">
        {{ t('shared.form.error.required') }}
      </mat-error>
    </mat-form-field>
  </form>

  <div class="tw:mt-5 tw:flex tw:justify-between">
    <button type="button" class="tw:dv-button-outline" (click)="cancel()">
      {{ t('shared.cancel') }}
    </button>
    <button type="submit" [disabled]="form.invalid" class="tw:dv-button-main-primary tw:ml-2" (click)="confirm()">
      {{ t('shared.form.save') }}
    </button>
  </div>
</section>
